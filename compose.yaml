services:
  memories:
    build: .
    image: memories
    container_name: memories
    env_file: .env
    environment:
      MEMORIES_DATA_DIR: /data
    # Publish only on the host loopback so the container stays private to a
    # reverse proxy (nginx). Host side is MEMORIES_HTTP_PORT (default 8090);
    # the container side stays 8090 (the app's WEB_PORT default).
    ports: ["127.0.0.1:${MEMORIES_HTTP_PORT:-8090}:8090"]
    volumes:
      - ./data:/data
    restart: unless-stopped
